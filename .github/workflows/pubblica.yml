# Pubblica l'app su GitHub Pages (gratis) ad ogni push sul ramo main.
# Ogni pubblicazione con modifiche all'app viene proposta ai tablet come aggiornamento all'avvio.
name: Pubblica app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepara l'app
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
